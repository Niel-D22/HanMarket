[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
# VerifyDeployment and Rehearsal read the deployment JSON; nothing else on disk is readable from a script
fs_permissions = [{ access = "read", path = "./deployments" }]
remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "forge-std/=lib/forge-std/src/",
]

[fuzz]
runs = 1000

[rpc_endpoints]
robinhood_testnet = "${ROBINHOOD_TESTNET_RPC}"
robinhood = "${ROBINHOOD_MAINNET_RPC}"

# style lints stay available through `forge lint`; off during builds so the deploy output stays readable
[lint]
lint_on_build = false
